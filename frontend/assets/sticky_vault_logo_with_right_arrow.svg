<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 160" width="420" height="160" fill="none">
  <!-- Soft background card / shadow layers from original icon -->
  <g transform="translate(20, 20)">
    <!-- Lilac background square angled -->
    <rect x="22" y="16" width="68" height="68" rx="14" fill="#DDD6FE" transform="rotate(-6 56 50)"/>
    <!-- Buttercup yellow sticky square angled -->
    <rect x="32" y="24" width="70" height="70" rx="14" fill="#FEF08A" transform="rotate(4 67 59)" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.08))"/>
    <!-- Main white sticky note pad -->
    <rect x="28" y="28" width="68" height="68" rx="14" fill="#FDFBF7" stroke="#1E1E24" stroke-width="2.5"/>
    <!-- Little sticky note curled corner / folded peel -->
    <path d="M76 28 L96 48 L76 48 Z" fill="#F3EFE6" stroke="#1E1E24" stroke-width="2" stroke-linejoin="round"/>
    <!-- Lock icon in the center -->
    <rect x="50" y="60" width="24" height="18" rx="5" fill="#1E1E24"/>
    <path d="M55 60 V53 C55 49.134 58.134 46 62 46 C65.866 46 69 49.134 69 53 V60" stroke="#1E1E24" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="62" cy="68" r="2.5" fill="#FEF08A"/>
    
    <!-- Dynamic horizontal arrow pointing to the right as indicated in annotation -->
    <!-- Starting circular node at lock right edge -->
    <circle cx="78" cy="69" r="7" fill="#6366F1"/>
    <!-- Arrow stem with gradient transitioning into soft lavender tint -->
    <defs>
      <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#6366F1"/>
        <stop offset="35%" stop-color="#818CF8"/>
        <stop offset="100%" stop-color="#E0E7FF"/>
      </linearGradient>
    </defs>
    <!-- Arrow body pointing right -->
    <rect x="78" y="64" width="180" height="10" rx="5" fill="url(#arrowGrad)"/>
    <!-- Arrow arrowhead pointing right -->
    <path d="M250 51 L280 69 L250 87 Z" fill="#E0E7FF" stroke-linejoin="round"/>
  </g>
</svg>